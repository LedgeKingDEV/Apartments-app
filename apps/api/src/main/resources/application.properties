# ===============================
# DATABASE CONFIGURATION
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/booking_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool - tuned for Railway shared resources
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=0
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.initialization-fail-timeout=-1

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===============================
# SERVER
# ===============================
server.port=${PORT:8084}

# Graceful shutdown for clean deploys
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ===============================
# JWT
# ===============================
spring.security.jwt.secret=${JWT_SECRET:}
spring.security.jwt.expiration=${JWT_EXPIRATION:3600000}

# ===============================
# STORAGE
# ===============================
storage.local-base-path=${STORAGE_BASE_PATH:uploads}
storage.public-url=${STORAGE_PUBLIC_URL:http://localhost:8080/api/files}

# ===============================
# PAYMENT
# ===============================
payment.provider=${PAYMENT_PROVIDER:local}

paystack.secret-key=${PAYSTACK_SECRET_KEY:}

flutterwave.client-id=${FLUTTERWAVE_CLIENT_ID:}
flutterwave.client-secret=${FLUTTERWAVE_CLIENT_SECRET:}
flutterwave.encryption-key=${FLUTTERWAVE_ENCRYPTION_KEY:}

# ===============================
# ADMIN ACCESS CONTROL
# ===============================
admin.allowed-email-domain=${ADMIN_ALLOWED_EMAIL_DOMAIN:apartify.com}
admin.bootstrap.token=${ADMIN_BOOTSTRAP_TOKEN:}

# ===============================
# KYC / AML COMPLIANCE
# ===============================
kyc.basic-daily-withdrawal-limit=${KYC_BASIC_DAILY_WITHDRAWAL_LIMIT:500000}
kyc.verified-daily-withdrawal-limit=${KYC_VERIFIED_DAILY_WITHDRAWAL_LIMIT:2000000}
kyc.basic-monthly-withdrawal-limit=${KYC_BASIC_MONTHLY_WITHDRAWAL_LIMIT:2000000}
kyc.verified-monthly-withdrawal-limit=${KYC_VERIFIED_MONTHLY_WITHDRAWAL_LIMIT:10000000}
kyc.unverified-daily-deposit-limit=${KYC_UNVERIFIED_DAILY_DEPOSIT_LIMIT:500000}
kyc.basic-daily-deposit-limit=${KYC_BASIC_DAILY_DEPOSIT_LIMIT:1000000}
kyc.verified-daily-deposit-limit=${KYC_VERIFIED_DAILY_DEPOSIT_LIMIT:5000000}
kyc.max-withdrawals-per-hour=${KYC_MAX_WITHDRAWALS_PER_HOUR:3}
kyc.max-withdrawals-per-day=${KYC_MAX_WITHDRAWALS_PER_DAY:10}
kyc.withdrawal-cooldown-after-deposit-minutes=${KYC_WITHDRAWAL_COOLDOWN_MINUTES:5}
kyc.large-single-transaction-threshold=${KYC_LARGE_TRANSACTION_THRESHOLD:1000000}
kyc.require-bank-binding=${KYC_REQUIRE_BANK_BINDING:true}

# ===============================
# CORS
# ===============================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# ===============================
# SWAGGER
# ===============================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ===============================
# MAILJET
# ===============================
mailjet.api-key=${MAILJET_API_KEY:}
mailjet.api-secret=${MAILJET_API_SECRET:}
mailjet.from-email=${MAILJET_FROM_EMAIL:nigerianapartments@apartifyafrica.site}
mailjet.from-name=${MAILJET_FROM_NAME:Nigerian Apartments}
app.reset-password.url=${RESET_PASSWORD_URL:nigerianapartments://reset-password}

# ===============================
# FILE UPLOAD
# ===============================
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=100MB
server.tomcat.max-http-form-post-size=100MB
server.tomcat.max-swallow-size=100MB

# ===============================
# STATIC RESOURCES
# ===============================
spring.web.resources.add-mappings=false

# ===============================
# SEEDING (disabled by default; set true for local dev only)
# ===============================
app.seed-default-data=${SEED_DEFAULT_DATA:false}
