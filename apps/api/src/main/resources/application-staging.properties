# Staging Configuration for Frontend Integration Testing
# Use this profile with: --spring.profiles.active=staging

# Database - resolved by DatabaseConfig from environment variables
# Priority: SPRING_DATASOURCE_URL > DATABASE_URL (postgres:// or postgresql://)
#           > PGHOST/PGPORT/PGUSER/PGPASSWORD/PGDATABASE > these defaults
# These defaults are only used when no cloud platform variables are present.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/booking_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Connection Pooling (Hikari) settings for reliability
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# JPA/Hibernate settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Security - Use environment variable or default for staging
spring.security.jwt.secret=${JWT_SECRET:}
spring.security.jwt.expiration=${JWT_EXPIRATION:3600000}

# Storage - Use environment variables; default to local filesystem path and public URL of staging backend
# local-base-path must be a filesystem directory, NOT a URL
storage.local-base-path=${STORAGE_BASE_PATH:uploads}
storage.public-url=${STORAGE_PUBLIC_URL:https://booking-backend-production-a51d.up.railway.app/api/files}

# Payment Provider - Use local for testing, or set to paystack with test keys
payment.provider=${PAYMENT_PROVIDER:local}
paystack.secret-key=${PAYSTACK_SECRET_KEY:}

# Flutterwave Configuration (OAuth 2.0)
flutterwave.client-id=${FLUTTERWAVE_CLIENT_ID:}
flutterwave.client-secret=${FLUTTERWAVE_CLIENT_SECRET:}
flutterwave.encryption-key=${FLUTTERWAVE_ENCRYPTION_KEY:}

# Server - Allow CORS for frontend integration
# Cloud platforms may set PORT env var, use it if available
server.port=${PORT:${SERVER_PORT:8081}}

# CORS Configuration - Use * for React Native, or specific URLs for web
# For React Native: Set CORS_ALLOWED_ORIGINS=* in environment variables
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Static Resource Configuration - Fix for "No static resource api/apartments" error
# This prevents Spring Boot from trying to serve /api/** routes as static files
spring.web.resources.add-mappings=false

# Swagger/OpenAPI - Enabled for frontend team to explore API
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.enabled=true

# Logging - Reduced verbosity to prevent Railway rate limiting (500 logs/sec)
# Use INFO level to see important messages without overwhelming logs
logging.level.root=WARN
logging.level.com.example.booking=INFO
logging.level.com.example.booking.payment.FlutterwaveService=INFO
# Hibernate - Set to WARN to disable DEBUG logs
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=false
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.level.org.hibernate.orm=WARN
logging.level.org.hibernate.orm.sql=WARN
logging.level.org.hibernate.orm.sql.ast=OFF
logging.level.org.hibernate.orm.sql.exec=OFF
logging.level.org.hibernate.orm.results=OFF
logging.level.org.hibernate.orm.results.loading=OFF
logging.level.org.hibernate.ejb=WARN
logging.level.org.hibernate.type=WARN
# Spring Framework - Set to WARN to disable DEBUG logs
logging.level.org.springframework=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.boot=WARN
logging.level.org.springframework.orm=WARN
logging.level.org.springframework.orm.jpa=WARN
logging.level.org.springframework.transaction=WARN
logging.level.org.springframework.jdbc=WARN
# PostgreSQL JDBC driver - Set to WARN
logging.level.org.postgresql=WARN
logging.level.org.postgresql.jdbc=WARN
# Disable HikariCP connection pool housekeeper logs (runs every 30 seconds)
logging.level.com.zaxxer.hikari=WARN
logging.level.com.zaxxer.hikari.pool=WARN
logging.level.com.zaxxer.hikari.pool.HikariPool=WARN

